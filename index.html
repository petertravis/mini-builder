<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Record Layout Builder</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f1f3; height: 100vh; overflow: hidden; color: #1a1a1a; }

/* ── TOP BAR ── */
.top-bar { position: fixed; top: 0; left: 0; right: 0; height: 48px; background: white; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; padding: 0 20px; z-index: 200; }
.tb-title { font-size: 15px; font-weight: 600; color: #1a1a1a; flex-shrink: 0; }
.tb-modes { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; }
.mode-btn { width: 32px; height: 28px; border: none; border-radius: 6px; background: transparent; cursor: pointer; color: #aaa; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.mode-btn:hover { color: #555; background: #f5f5f5; }
.mode-btn.on { color: #1a1a1a; background: #f0f0f0; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 7px; }
.tb-av { width: 26px; height: 26px; border-radius: 50%; background: #7c3aed; color: white; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tb-btn { padding: 5px 12px; border-radius: 6px; border: 1px solid #ddd; background: white; font-size: 13px; color: #444; cursor: pointer; font-family: inherit; transition: background 0.1s; }
.tb-btn:hover { background: #f5f5f5; }
.tb-btn.blue { border-color: #0073ea; background: #0073ea; color: white; font-weight: 500; }
.tb-btn.blue:hover { background: #0062c7; }
.tb-btn.blue.ok { background: #16a34a; border-color: #16a34a; }
.tb-ib { width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent; cursor: pointer; color: #888; display: flex; align-items: center; justify-content: center; }
.tb-ib:hover { background: #f5f5f5; color: #333; }

/* ── APP BODY ── */
.app-body { display: flex; margin-top: 48px; height: calc(100vh - 48px); overflow: hidden; }

/* ── SIDE NAV ── */
.side-nav { width: 196px; flex-shrink: 0; background: white; border-right: 1px solid #eaeaea; overflow-y: auto; padding: 16px 8px 24px; }
.sn-group { margin-bottom: 22px; }
.sn-group-lbl { font-size: 11px; font-weight: 600; color: #c0c0c0; text-transform: uppercase; letter-spacing: 0.6px; padding: 2px 8px 8px; }
.sn-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 6px; border: none; background: transparent; cursor: pointer; font-size: 13px; color: #555; text-align: left; font-family: inherit; transition: background 0.1s; }
.sn-item:hover { background: #f5f5f5; color: #1a1a1a; }
.sn-item.active { background: #f0e8ff; color: #6d28d9; font-weight: 500; }
.sn-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.sn-sub { font-size: 11px; color: #ccc; margin-left: auto; }
.sn-item.active .sn-sub { color: #a78bfa; }

/* ── MAIN ── */
.main { flex: 1; height: 100%; overflow: hidden; }
.view { height: 100%; overflow-y: auto; }
.view.hidden { display: none; }

/* ── EDIT VIEW ── */
.edit-view { background: #f0f1f3; padding: 0; }
.sections-wrap { max-width: none; margin: 0; }

/* ── TWO-COLUMN BUILDER ── */
.builder-layout { display: flex; align-items: stretch; min-height: calc(100vh - 48px); }
.builder-doc { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 28px 28px 60px; }
.builder-panel-col { width: 272px; flex-shrink: 0; position: sticky; top: 0; height: calc(100vh - 48px); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 20px 16px 40px; border-left: 1px solid #e0e0e0; background: #f7f7f8; }

/* Builder blocks */
.bd { background: white; border-radius: 10px; border: 1px solid #e5e7eb; overflow: hidden; }
.bd.drag-over { outline: 2px solid #0073ea; outline-offset: -1px; }
.bd-hd { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: #f0f5fe; border-bottom: 1px solid #dce8ff; -webkit-user-select: none; -moz-user-select: none; user-select: none; }
.bd-hd.draggable { cursor: grab; }
.bd-hd.draggable:active { cursor: grabbing; }
.bd-lbl { font-size: 10.5px; font-weight: 700; color: #5b87d6; text-transform: uppercase; letter-spacing: 0.6px; flex: 1; display: flex; align-items: center; gap: 5px; }
.bd-lbl input { font-size: 10.5px; font-weight: 700; color: #5b87d6; text-transform: uppercase; letter-spacing: 0.6px; background: transparent; border: none; outline: none; font-family: inherit; width: 100%; cursor: grab; }
.bd-lbl input:focus { background: rgba(255,255,255,0.7); border-radius: 3px; cursor: text; text-transform: none; letter-spacing: 0; }
.bd-acts { display: flex; gap: 1px; flex-shrink: 0; }

/* Heading block */
.bd-heading { padding: 12px 16px 14px; }
.bd-backlinks { font-size: 11.5px; color: #ccc; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
.bd-rec-title { font-size: 24px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; line-height: 1.2; }
.bd-prop-rows { display: flex; flex-direction: column; }
.bd-prop-row { display: flex; align-items: center; min-height: 30px; border-radius: 6px; padding: 0 4px; }
.bd-prop-row:hover { background: #f5f5f5; }
.bd-prop-row:hover .bd-row-act { opacity: 1; }
.bd-prop-icon-lbl { width: 130px; font-size: 13px; color: #888; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 2px 8px 2px 2px; white-space: nowrap; overflow: hidden; }
.bd-prop-val { flex: 1; font-size: 13px; color: #1a1a1a; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.bd-row-act { width: 20px; height: 20px; border: none; background: transparent; cursor: pointer; color: #b0b0b0; border-radius: 3px; display: flex; align-items: center; justify-content: center; opacity: 0; padding: 0; flex-shrink: 0; transition: all 0.1s; }
.bd-row-act:hover { background: #f0e8ff; color: #7c3aed; }
.bd-add-prop { display: flex; align-items: center; gap: 6px; padding: 5px 2px; font-size: 12px; color: #ccc; cursor: pointer; border-radius: 5px; margin-top: 4px; border: none; background: transparent; font-family: inherit; transition: all 0.1s; }
.bd-add-prop:hover { color: #0073ea; }
/* "Move to side panel" pill button on block headers */
.bd-panel-btn { display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 5px; border: 1px solid #e0e0e0; background: white; font-size: 11px; color: #999; cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.12s; flex-shrink: 0; }
.bd-panel-btn:hover { border-color: #0073ea; color: #0073ea; background: #f0f7ff; }
.bd-panel-btn svg { flex-shrink: 0; }

/* Block body areas */
.bd-body { padding: 10px 14px 12px; }
.bd-rt-preview { font-size: 13px; color: #bbb; line-height: 1.6; font-style: italic; }
.bd-locked { font-size: 13px; color: #ccc; display: flex; align-items: center; gap: 6px; }

/* Right panel card */
.bp-card { background: white; border-radius: 10px; border: 1px solid #e5e7eb; overflow: hidden; }
.bp-hd { display: flex; align-items: center; gap: 7px; padding: 10px 14px; border-bottom: 1px solid #f2f2f2; }
.bp-title { font-size: 13px; font-weight: 600; color: #1a1a1a; flex: 1; }
.bp-body { padding: 2px 0; }
.bp-row { display: flex; align-items: center; padding: 5px 14px; gap: 10px; min-height: 30px; cursor: default; }
.bp-row:hover { background: #fafafa; }
.bp-row:hover .bp-del { opacity: 1; }
.bp-lbl { width: 88px; font-size: 12px; color: #aaa; flex-shrink: 0; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bp-val { font-size: 13px; color: #1a1a1a; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0; }
.bp-del { width: 18px; height: 18px; border: none; background: transparent; cursor: pointer; color: #ccc; border-radius: 3px; display: flex; align-items: center; justify-content: center; opacity: 0; padding: 0; flex-shrink: 0; transition: all 0.1s; }
.bp-del:hover { background: #fff1f1; color: #dc2626; opacity: 1; }
.bp-add { display: flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 13px; color: #aaa; cursor: pointer; border-top: 1px solid #f2f2f2; border: none; background: transparent; width: 100%; font-family: inherit; text-align: left; }
.bp-add:hover { color: #0073ea; background: #f7fbff; }
.bp-empty { padding: 18px 14px; font-size: 12px; color: #ccc; text-align: center; line-height: 1.7; }
/* Panel section mini-cards */
.bp-sec-card { background: white; border-radius: 8px; border: 1px solid #e5e7eb; overflow: hidden; }
.bp-sec-card-hd { display: flex; align-items: center; gap: 6px; padding: 7px 8px 7px 12px; background: #f0f5fe; border-bottom: 1px solid #dce8ff; }
.bp-sec-card-lbl { font-size: 10.5px; font-weight: 700; color: #5b87d6; text-transform: uppercase; letter-spacing: 0.6px; flex: 1; display: flex; align-items: center; gap: 5px; }
.bp-back-btn { display: flex; align-items: center; gap: 3px; font-size: 11px; color: #bbb; cursor: pointer; border: none; background: transparent; font-family: inherit; padding: 3px 6px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
.bp-back-btn:hover { background: #fff0f0; color: #dc2626; }

/* Section cards */
.sc { background: white; border-radius: 10px; border: 1px solid #e5e7eb; overflow: hidden; }
.sc.drag-over { outline: 2px solid #0073ea; outline-offset: -1px; }

/* Card header */
.sc-hd { display: flex; align-items: center; gap: 7px; padding: 10px 14px; min-height: 42px; }
.sc-hd.has-body { border-bottom: 1px solid #f2f2f2; }
.sc-hd.draggable { cursor: grab; }
.sc-hd.draggable:active { cursor: grabbing; }
.sc-icon { color: #b0b0b0; display: flex; align-items: center; flex-shrink: 0; }
.sc-name { font-size: 13.5px; font-weight: 500; color: #1a1a1a; flex: 1; border: none; background: transparent; font-family: inherit; outline: none; cursor: text; padding: 2px 4px; border-radius: 3px; min-width: 0; }
.sc-name:hover:not([readonly]) { background: #f5f5f5; }
.sc-name:focus { background: #f0e8ff; color: #5b21b6; }
.sc-name[readonly] { cursor: default; pointer-events: none; }
.sc-name.light { font-size: 13px; color: #888; font-weight: 400; }
.sc-btns { display: flex; gap: 1px; flex-shrink: 0; }
.sib { width: 26px; height: 26px; border-radius: 5px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #d0d0d0; transition: all 0.1s; font-family: inherit; }
.sib:hover { background: #f0f0f0; color: #555; }
.sib.del:hover { color: #dc2626; background: #fff1f1; }

/* Rich text section body */
.sc-rt-body { padding: 12px 14px 14px; position: relative; }
.sc-rt-area { width: 100%; min-height: 88px; border: 1px solid #efefef; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #aaa; font-family: inherit; resize: vertical; outline: none; background: #fafafa; line-height: 1.6; display: block; }
.sc-rt-area:focus { border-color: #c4b5fd; background: white; color: #333; }
.sc-rt-btns { position: absolute; top: 18px; right: 20px; display: flex; gap: 1px; }

/* Fields table */
.fr { display: flex; align-items: stretch; border-bottom: 1px solid #f5f5f5; cursor: grab; position: relative; transition: background 0.1s; -webkit-user-select: none; -moz-user-select: none; user-select: none; min-height: 38px; }
.fr:last-of-type { border-bottom: none; }
.fr:hover { background: #fafafa; }
.fr:active { cursor: grabbing; }
.fr.dragging { opacity: 0.2; }
.fr.drop-above::before { content: ''; position: absolute; top: -1px; left: 0; right: 0; height: 2px; background: #0073ea; z-index: 2; }
.fr.off { opacity: 0.38; }
.fr-key { width: 148px; flex-shrink: 0; padding: 0 10px 0 14px; display: flex; align-items: center; gap: 7px; font-size: 13px; color: #777; border-right: 1px solid #f2f2f2; }
.fr-key-ico { color: #c8c8c8; display: flex; align-items: center; flex-shrink: 0; }
.fr-key-lbl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fr-val { flex: 1; padding: 8px 10px; display: flex; align-items: center; }
.fr-act { display: flex; align-items: center; gap: 1px; padding-right: 8px; flex-shrink: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 5px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip-or { background: #fff3e0; color: #b85c00; }
.chip-yl { background: #fefce8; color: #92400e; }
.chip-pu { background: #f3e8ff; color: #6d28d9; }
.chip-pk { background: #fdf2f8; color: #be185d; }
.chip-gy { background: #f3f4f6; color: #4b5563; }
.chip-gn { background: #dcfce7; color: #166534; }
.chip-bl { background: #dbeafe; color: #1d4ed8; }
.chip-plain { font-size: 13px; color: #888; }
.add-fr { display: flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 13px; color: #aaa; cursor: pointer; transition: all 0.1s; border-top: 1px solid #f2f2f2; }
.add-fr:hover { color: #0073ea; background: #f7fbff; }

/* Add section card */
.add-sec-card { background: white; border-radius: 10px; border: 1px solid #e5e7eb; padding: 10px 14px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #aaa; cursor: pointer; transition: all 0.12s; }
.add-sec-card:hover { color: #0073ea; border-color: #c4b5fd; background: #faf7ff; }

/* Comments locked card */
.sc-locked-hd { display: flex; align-items: center; gap: 7px; padding: 10px 14px; min-height: 42px; }
.sc-locked-name { font-size: 13.5px; font-weight: 400; color: #888; flex: 1; }

/* ── PREVIEW VIEW ── */
.preview-view { background: #f0f1f3; display: flex; justify-content: center; align-items: flex-start; padding: 28px 24px; }
/* Floating card wrapper — contains both the main content and side panel */
.rp { background: white; border-radius: 10px; border: 1px solid #e5e7eb; box-shadow: 0 2px 16px rgba(0,0,0,0.07); max-height: calc(100vh - 96px); display: flex; flex-direction: column; overflow: hidden; }
/* Single header spanning full card+panel width */
.rp-hd { display: flex; align-items: center; gap: 3px; padding: 0 12px; height: 42px; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; background: white; }
.rp-type { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #777; flex: 1; }
.ra { width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent; cursor: pointer; color: #888; display: flex; align-items: center; justify-content: center; transition: all 0.1s; flex-shrink: 0; }
.ra:hover { background: #f0f0f0; color: #333; }
.ra.share { padding: 0 9px; width: auto; font-size: 13px; font-weight: 500; color: #333; }
.ra.panel-on { color: #0073ea; background: #e8f3ff; }
/* Body row: main content + optional side panel */
.rp-body { flex: 1; display: flex; overflow: hidden; }
.rp-main { width: 460px; flex-shrink: 0; overflow-y: auto; padding-bottom: 36px; }
/* Side panel — same height as card, flush right */
.rp-side { width: 260px; flex-shrink: 0; border-left: 1px solid #f0f0f0; overflow-y: auto; display: flex; flex-direction: column; }
.rp-side.hidden { display: none; }
.rp-side-hd { display: flex; align-items: center; gap: 6px; padding: 0 14px; height: 42px; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; }
.rp-side-title { font-size: 12.5px; font-weight: 600; color: #555; flex: 1; display: flex; align-items: center; gap: 6px; }
.rp-side-add { width: 18px; height: 18px; border: none; background: transparent; cursor: pointer; color: #ccc; font-size: 16px; display: flex; align-items: center; justify-content: center; border-radius: 3px; padding: 0; flex-shrink: 0; line-height: 1; }
.rp-side-add:hover { background: #f0f0f0; color: #555; }
.rp-side-body { flex: 1; padding: 4px 0 16px; }
.rp-side-sec { padding: 12px 14px 2px; font-size: 10px; font-weight: 700; color: #c8c8c8; letter-spacing: 0.6px; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
.rp-side-row { display: flex; align-items: center; padding: 5px 14px; min-height: 30px; gap: 0; cursor: default; }
.rp-side-row:hover { background: #fafafa; }
.rp-side-lbl { width: 104px; font-size: 12.5px; color: #999; flex-shrink: 0; display: flex; align-items: center; gap: 5px; padding-right: 8px; }
.rp-side-val { font-size: 13px; color: #1a1a1a; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0; }
/* Labeled property rows below title */
.rp-props { padding: 0 16px 14px; }
.rpp-row { display: flex; align-items: center; min-height: 28px; border-radius: 5px; padding: 2px 2px; cursor: default; }
.rpp-row:hover { background: #f5f5f5; }
.rpp-lbl { width: 128px; font-size: 12.5px; color: #999; flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
.rpp-val { flex: 1; font-size: 13px; color: #1a1a1a; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.rp-title { padding: 18px 16px 8px; font-size: 22px; font-weight: 700; color: #1a1a1a; line-height: 1.2; }
/* Collapsible sections */
.rs { border-top: 1px solid #f0f0f0; }
.rs-hd { display: flex; align-items: center; gap: 6px; padding: 8px 16px; cursor: pointer; -webkit-user-select: none; -moz-user-select: none; user-select: none; }
.rs-hd:hover { background: #fafafa; }
.rs-chev { color: #ccc; flex-shrink: 0; display: flex; transition: transform 0.18s; }
.rs.closed .rs-chev { transform: rotate(-90deg); }
.rs.closed .rs-body { display: none; }
.rs-label { font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 0.6px; flex: 1; }
.rs-badge { font-size: 11px; color: #bbb; background: #f3f4f6; border-radius: 3px; padding: 1px 5px; font-weight: 500; }
.rs-body.rtf { padding: 4px 16px 16px; }
.rtf-lbl { font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 5px; }
.rtf-txt { font-size: 13px; color: #444; line-height: 1.65; }
.rtf-txt p { margin-bottom: 6px; }
.rtf-txt strong { font-weight: 600; color: #1a1a1a; }
.rtf-txt ul, .rtf-txt ol { padding-left: 18px; margin-bottom: 4px; }
.rtf-txt li { margin-bottom: 3px; }
.rtf-sep { height: 1px; background: #f0f0f0; margin: 14px 0; }
.rtf-img { width: 100%; height: 140px; background: #f3f4f6; border-radius: 7px; margin: 10px 0 2px; display: flex; align-items: center; justify-content: center; color: #c8c8c8; font-size: 12px; border: 1px solid #eee; }
.rpf { display: flex; align-items: center; padding: 4px 0; gap: 8px; min-height: 26px; }
.rpf-lbl { width: 100px; font-size: 12px; color: #999; flex-shrink: 0; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; }
.rpf-val { font-size: 13px; color: #1a1a1a; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.rt { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
.rt-or { background: #fff3e0; color: #c66000; }
.rt-yl { background: #fefce8; color: #854d0e; }
.rt-pu { background: #f3e8ff; color: #6d28d9; }
.rt-gy { background: #f3f4f6; color: #374151; }
.rt-gn { background: #dcfce7; color: #166534; }
.rt-bl { background: #dbeafe; color: #1d4ed8; }
.av-xs { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; color: white; }
.rs-body.docs { padding: 4px 16px 12px; }
.doc-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-radius: 6px; cursor: pointer; }
.doc-row:hover { background: #f9f9f9; margin: 0 -6px; padding-left: 6px; padding-right: 6px; }
.doc-ic { width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: white; flex-shrink: 0; }
.doc-ic.pdf { background: #ef4444; }
.doc-ic.img { background: #22c55e; }
.doc-name { font-size: 13px; color: #222; flex: 1; }
.doc-ext { font-size: 11px; color: #bbb; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
.rs-body.cmts { padding: 6px 16px 16px; }
.cmt-tabs { display: flex; border-bottom: 1px solid #f0f0f0; margin-bottom: 14px; }
.ct { padding: 5px 0; margin-right: 18px; font-size: 12.5px; color: #bbb; cursor: pointer; border-bottom: 2px solid transparent; }
.ct.on { color: #1a1a1a; border-color: #1a1a1a; font-weight: 500; }
.c-row { display: flex; gap: 10px; margin-bottom: 14px; align-items: flex-start; }
.av-md { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: white; flex-shrink: 0; margin-top: 1px; }
.c-r { flex: 1; min-width: 0; }
.c-meta { font-size: 11.5px; color: #aaa; margin-bottom: 3px; line-height: 1.4; }
.c-meta b { color: #333; font-weight: 600; }
.c-body { font-size: 13px; color: #333; line-height: 1.5; }
.c-tag { display: inline-flex; align-items: center; background: #eef2ff; color: #4338ca; border-radius: 3px; padding: 0 4px; font-size: 12px; font-weight: 500; }
.c-like { border: none; background: transparent; cursor: pointer; color: #e0e0e0; font-size: 14px; padding: 2px 0 0; flex-shrink: 0; line-height: 1; margin-top: 2px; }
.c-like:hover { color: #999; }
.c-in-row { display: flex; gap: 8px; align-items: center; padding-top: 10px; border-top: 1px solid #f0f0f0; margin-top: 6px; }
.c-in { flex: 1; border: 1px solid #e8e8e8; border-radius: 20px; padding: 7px 14px; font-size: 13px; color: #bbb; font-family: inherit; outline: none; }
.c-in:focus { border-color: #c4b5fd; color: #1a1a1a; }
.c-tb { width: 24px; height: 24px; border: none; background: transparent; cursor: pointer; color: #ccc; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
.c-tb:hover { background: #f0f0f0; color: #555; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

/* ── PIN & PANEL ── */
.panel-divider { display: flex; align-items: center; gap: 10px; padding: 12px 4px 6px; color: #c8c8c8; font-size: 10.5px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; -webkit-user-select: none; -moz-user-select: none; user-select: none; }
.panel-divider::before, .panel-divider::after { content: ''; flex: 1; height: 1px; background: #ebebeb; }
.panel-divider svg { flex-shrink: 0; }
.sc.in-panel { border-color: #dbeafe; background: #f8fbff; }
.sc.in-panel .sc-hd { border-bottom-color: #e4effe; }
.sc.in-panel .sc-hd.has-body { border-bottom-color: #e4effe; }
.sib.pin-on { color: #7c3aed; background: #f0e8ff; }
.sib.panel-on { color: #2563eb; background: #eff6ff; }

/* ── FULL-SCREEN DOC VIEW ── */
.fv { position: fixed; inset: 0; z-index: 300; background: white; display: flex; flex-direction: column; }
.fv.hidden { display: none; }
.fv-bar { height: 44px; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; padding: 0 14px; gap: 3px; flex-shrink: 0; }
.fv-tools { display: flex; align-items: center; gap: 1px; flex: 1; }
.fv-btn { width: 26px; height: 26px; border: none; background: transparent; cursor: pointer; color: #555; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 13px; font-family: inherit; }
.fv-btn:hover { background: #f0f0f0; }
.fv-sep { width: 1px; height: 16px; background: #e8e8e8; margin: 0 5px; flex-shrink: 0; }
.fv-para { padding: 3px 8px; border: none; background: transparent; font-family: inherit; font-size: 13px; color: #444; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
.fv-para:hover { background: #f0f0f0; }
.fv-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.fv-toggle { padding: 4px 11px; border-radius: 6px; border: none; font-size: 13px; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; }
.fv-toggle.on { background: #eef2ff; color: #4338ca; }
.fv-toggle:not(.on) { background: transparent; color: #555; }
.fv-toggle:hover { background: #f0f0f0; }
.fv-saved { font-size: 12px; color: #bbb; padding: 0 4px; white-space: nowrap; }
.fv-ib { width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent; cursor: pointer; color: #888; display: flex; align-items: center; justify-content: center; }
.fv-ib:hover { background: #f5f5f5; color: #333; }
.fv-share { padding: 5px 12px; border-radius: 6px; border: 1px solid #ddd; background: white; font-size: 13px; color: #444; cursor: pointer; font-family: inherit; }
.fv-share:hover { background: #f5f5f5; }
.fv-body { flex: 1; display: flex; overflow: hidden; }
.fv-doc-wrap { flex: 1; overflow-y: auto; padding: 48px 72px 80px; }
.fv-doc { max-width: 700px; margin: 0 auto; }
.fv-doc.narrow { max-width: 560px; }
.fv-breadcrumb { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #aaa; margin-bottom: 24px; }
.fv-bc-item { cursor: pointer; }
.fv-bc-item:hover { color: #555; }
.fv-bc-sep { color: #ddd; font-size: 10px; }
.fv-title { font-size: 36px; font-weight: 700; color: #1a1a1a; line-height: 1.18; margin-bottom: 14px; }
.fv-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid #f2f2f2; }
.fv-chip-group { display: inline-flex; align-items: center; gap: 5px; }
.fv-chip-lbl { font-size: 12px; color: #bbb; }
.fv-article-lbl { font-size: 11px; font-weight: 500; color: #aaa; letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 24px; display: flex; align-items: center; gap: 6px; }
.fv-sect { margin-bottom: 22px; }
.fv-sect-h { font-size: 15px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
.fv-sect-body { font-size: 14px; color: #333; line-height: 1.75; }
.fv-sect-body p { margin-bottom: 10px; }
.fv-sect-body strong { font-weight: 600; }
.fv-sect-body ul, .fv-sect-body ol { padding-left: 20px; margin-bottom: 8px; }
.fv-sect-body li { margin-bottom: 5px; }
.fv-sect-divider { height: 1px; background: #f0f0f0; margin: 20px 0; }
.fv-img { width: 100%; height: 260px; background: #f3f4f6; border-radius: 10px; margin: 16px 0 20px; display: flex; align-items: center; justify-content: center; color: #c8c8c8; font-size: 13px; border: 1px solid #eee; }
.fv-props-sect { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid #f2f2f2; }
.fv-props-lbl { font-size: 11px; font-weight: 600; color: #bbb; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 10px; }
.fv-prop { display: flex; align-items: center; padding: 5px 0; gap: 12px; }
.fv-prop-lbl { width: 130px; font-size: 12px; color: #999; flex-shrink: 0; display: flex; align-items: center; gap: 5px; }
.fv-prop-val { font-size: 13px; color: #1a1a1a; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
/* Full-screen side panel (Notion-style) */
/* ── FULLSCREEN RIGHT PANEL (redesigned) ── */
.fv-cmts { width: 360px; flex-shrink: 0; border-left: 1px solid #e8e8e8; display: flex; flex-direction: row; overflow: hidden; background: white; }
.fv-cmts.hidden { display: none; }
/* Icon strip — left edge of panel */
.fvp-strip { width: 40px; flex-shrink: 0; border-right: 1px solid #f0f0f0; display: flex; flex-direction: column; align-items: center; padding: 10px 0 8px; gap: 1px; background: #fafafa; }
.fvp-strip-spacer { flex: 1; }
.fvp-icon { width: 28px; height: 28px; border: none; background: transparent; cursor: pointer; color: #ccc; display: flex; align-items: center; justify-content: center; border-radius: 6px; transition: all 0.1s; flex-shrink: 0; }
.fvp-icon:hover { background: #f0f0f0; color: #666; }
.fvp-icon.on { color: #4338ca; background: #eef2ff; }
/* Main panel area */
.fvp-main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.fvp-head { display: flex; align-items: center; padding: 0 10px 0 14px; height: 44px; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; gap: 4px; }
.fvp-title { font-size: 12.5px; font-weight: 600; color: #777; flex: 1; }
.fvp-add { width: 22px; height: 22px; border: none; background: transparent; cursor: pointer; color: #ccc; font-size: 17px; line-height: 1; display: flex; align-items: center; justify-content: center; border-radius: 4px; padding: 0; }
.fvp-add:hover { background: #f0f0f0; color: #444; }
.fvp-close { width: 26px; height: 26px; border: none; background: transparent; cursor: pointer; color: #ccc; display: flex; align-items: center; justify-content: center; border-radius: 4px; flex-shrink: 0; }
.fvp-close:hover { background: #f0f0f0; color: #444; }
/* Scrollable body */
.fvp-body { flex: 1; overflow-y: auto; padding-bottom: 24px; }
.fvp-body.hidden { display: none; }
/* Field rows — flat, no card wrappers */
.fvp-sec-lbl { font-size: 10px; font-weight: 700; color: #c8c8c8; letter-spacing: 0.6px; text-transform: uppercase; padding: 16px 14px 4px; display: flex; align-items: center; gap: 5px; }
.fvp-row { display: flex; align-items: center; padding: 5px 14px; min-height: 34px; cursor: default; }
.fvp-row:hover { background: #f9f9fa; }
.fvp-lbl { width: 130px; font-size: 13px; color: #aaa; flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
.fvp-val { flex: 1; font-size: 13px; color: #1a1a1a; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; }
/* Richtext content sections in panel */
.fvp-rt-divider { height: 1px; background: #f0f0f0; margin: 8px 14px 0; }
.fvp-rt-hd { font-size: 14px; font-weight: 700; color: #1a1a1a; padding: 14px 14px 6px; }
.fvp-rt-sub { font-size: 12px; font-weight: 600; color: #555; padding: 8px 14px 4px; }
.fvp-rt-body { font-size: 13px; color: #444; line-height: 1.65; padding: 0 14px; }
.fvp-rt-body p { margin-bottom: 6px; }
.fvp-rt-body strong { font-weight: 600; color: #1a1a1a; }
.fvp-rt-body ul, .fvp-rt-body ol { padding-left: 18px; margin-bottom: 6px; }
.fvp-rt-body li { margin-bottom: 3px; }
.fvp-rt-img { height: 130px; background: #f3f4f6; border-radius: 8px; margin: 8px 14px 4px; display: flex; align-items: center; justify-content: center; color: #c8c8c8; font-size: 12px; border: 1px solid #eee; }
/* Comments in panel */
.fvp-c-row { display: flex; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #f5f5f5; }
.fvp-c-row:first-child { border-top: none; }
.fvp-av { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: white; flex-shrink: 0; margin-top: 1px; }
.fvp-c-r { flex: 1; min-width: 0; }
.fvp-c-top { display: flex; align-items: baseline; gap: 5px; margin-bottom: 3px; }
.fvp-c-name { font-size: 12.5px; font-weight: 600; color: #1a1a1a; }
.fvp-c-date { font-size: 11px; color: #bbb; }
.fvp-c-body { font-size: 13px; color: #444; line-height: 1.5; }
.fvp-c-in { display: flex; gap: 8px; align-items: center; flex-shrink: 0; padding: 10px 14px; border-top: 1px solid #eeeeee; }
.fvp-c-input { flex: 1; border: 1px solid #e8e8e8; border-radius: 20px; padding: 7px 13px; font-size: 13px; color: #bbb; font-family: inherit; outline: none; }
.fvp-c-input:focus { border-color: #c4b5fd; color: #1a1a1a; }
/* Labeled property rows in fullscreen left doc (solo fields) */
.fv-prop-rows { margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid #f0f0f0; }
.fv-prop-row { display: flex; align-items: center; padding: 4px 0; gap: 0; min-height: 28px; border-radius: 5px; }
.fv-prop-row:hover { background: #f5f5f5; }
.fv-prop-row-lbl { width: 140px; font-size: 13px; color: #aaa; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding-right: 8px; }
.fv-prop-row-val { flex: 1; font-size: 13px; color: #1a1a1a; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.fv-c-in-row { display: flex; gap: 8px; align-items: center; flex-shrink: 0; padding: 10px 14px; border-top: 1px solid #e8e8e8; background: white; }
.fv-c-input { flex: 1; border: 1px solid #e8e8e8; border-radius: 20px; padding: 7px 13px; font-size: 13px; color: #bbb; font-family: inherit; outline: none; }
.fv-c-input:focus { border-color: #c4b5fd; color: #1a1a1a; }
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <symbol id="ic-edit"      viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5l2 2-8.5 8.5H3v-2l8.5-8.5z"/></symbol>

    <symbol id="ic-x"         viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></symbol>
    <symbol id="ic-plus"      viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></symbol>
    <symbol id="ic-chevron"   viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></symbol>
    <symbol id="ic-check"     viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l4 4 6-7"/></symbol>
    <symbol id="ic-diamond"   viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2l4 4-4 8-4-8 4-4z"/></symbol>

    <symbol id="ic-expand"    viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L13 3M10 3h3v3M7 9L3 13M3 10v3h3"/></symbol>

    <symbol id="ic-status"    viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="ic-priority"  viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M4 7l4-4 4 4"/></symbol>
    <symbol id="ic-tag"       viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2H14v5l-6 6a1.5 1.5 0 0 1-2 0L2 9a1.5 1.5 0 0 1 0-2l6-5z"/><circle cx="11.5" cy="4.5" r="1" fill="currentColor" stroke="none"/></symbol>

<!-- TOP BAR -->
<div class="top-bar">
  <span class="tb-title" id="tb-title">Episode database</span>
  <div class="tb-modes">
    <button class="mode-btn on" id="btn-edit" onclick="setMode('edit')" title="Edit layout">
      <svg width="15" height="15"><use href="#ic-edit"/></svg>
    </button>
    <button class="mode-btn" id="btn-preview" onclick="setMode('preview')" title="Preview record">
      <svg width="15" height="15"><use href="#ic-eye"/></svg>
    </button>
  </div>
  <div class="tb-right">
    <div class="tb-av">LR</div>
    <button class="tb-btn">Share</button>
    <button class="tb-btn" onclick="setMode('preview')">Cancel</button>
    <button class="tb-btn blue" id="save-btn" onclick="saveLayout()">Save</button>
    <button class="tb-ib"><svg width="14" height="14"><use href="#ic-more"/></svg></button>
  </div>
</div>

<div class="app-body">
  <!-- SIDE NAV -->
  <div class="side-nav">
    <div class="sn-group">
      <div class="sn-group-lbl">Records</div>
      <button class="sn-item active" data-type="episode" onclick="switchType('episode')">
        <span class="sn-dot" style="background:#f97316"></span>
        Episode
        <span class="sn-sub">Type A</span>
      </button>
      <button class="sn-item" data-type="mechanical" onclick="switchType('mechanical')">
        <span class="sn-dot" style="background:#6366f1"></span>
        Mechanical
        <span class="sn-sub">Type B</span>
      </button>
    </div>
    <div class="sn-group">
      <div class="sn-group-lbl">Docs</div>
      <button class="sn-item" data-type="spec" onclick="switchType('spec')">
        <span class="sn-dot" style="background:#10b981"></span>
        Dev Spec
      </button>
      <button class="sn-item" data-type="kb" onclick="switchType('kb')">
        <span class="sn-dot" style="background:#06b6d4"></span>
        KB Article
      </button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main">
    <div class="view edit-view" id="edit-view">
      <div class="sections-wrap" id="sections-wrap"></div>
    </div>
    <div class="view preview-view hidden" id="preview-view">
      <div class="rp" id="rp"></div>
    </div>
  </div>
</div>

<!-- FULL-SCREEN DOC OVERLAY -->
<div class="fv hidden" id="fv">
  <div class="fv-bar">
    <!-- Formatting toolbar (simulated) -->
    <div class="fv-tools">
      <button class="fv-btn" title="Undo"><svg width="13" height="13"><use href="#ic-arrow-r" style="transform:scaleX(-1)"/></svg></button>
      <button class="fv-btn" title="Redo"><svg width="13" height="13"><use href="#ic-arrow-r"/></svg></button>
      <div class="fv-sep"></div>
      <button class="fv-para">Paragraph <svg width="10" height="10" style="opacity:.5"><use href="#ic-chevron"/></svg></button>
      <div class="fv-sep"></div>
      <button class="fv-btn" style="font-weight:800;font-size:13px">B</button>
      <button class="fv-btn" style="font-style:italic;font-size:13px">I</button>
      <button class="fv-btn" style="text-decoration:underline;font-size:13px">U</button>

/* ── NAVIGATION ── */
function switchType(type) {
  currentType = type;
  layout = layouts[type];
  document.getElementById('tb-title').textContent = RECORD_META[type].dbTitle;
  document.querySelectorAll('.sn-item').forEach(el => {
    el.classList.toggle('active', el.dataset.type === type);
  });
  const isEdit = !document.getElementById('edit-view').classList.contains('hidden');
  if (isEdit) renderBuilder();
  else renderRecord();
}

/* ── MODE ── */
function setMode(mode) {
  document.getElementById('edit-view').classList.toggle('hidden', mode !== 'edit');
  document.getElementById('preview-view').classList.toggle('hidden', mode !== 'preview');
  document.getElementById('btn-edit').classList.toggle('on', mode === 'edit');
  document.getElementById('btn-preview').classList.toggle('on', mode === 'preview');
  if (mode === 'preview') { rpPanelOpen = false; renderRecord(); }
}

function saveLayout() {
  const btn = document.getElementById('save-btn');
  btn.innerHTML = '<svg width="12" height="12" style="display:inline-block;vertical-align:-1px;margin-right:3px"><use href="#ic-check"/></svg>Saved';
  btn.classList.add('ok');
  setTimeout(() => { btn.textContent = 'Save'; btn.classList.remove('ok'); }, 2000);
}

/* ── RENDER BUILDER ── */
function renderBuilder() {
  const wrap = document.getElementById('sections-wrap');
  const meta = RECORD_META[currentType];

  // Categorize sections
  const solos       = layout.filter(s => s.secType === 'solo'  && !(s.inPanel ?? false) && s.visible);
  const panelSecs   = layout.filter(s =>  (s.inPanel ?? false) && s.visible);
  const mainSecs    = layout.filter(s => !(s.inPanel ?? false) && s.secType !== 'solo');

  // Collect pinned fields from main field sections
  const pinnedFields = [];
  mainSecs.forEach(sec => {
    if (sec.secType === 'fields')
      sec.fields.forEach(f => { if (f.visible && (f.pinned ?? false)) pinnedFields.push({sec, f}); });
  });

  let h = `<div class="builder-layout">`;

  /* ── LEFT: Document area ── */
  h += `<div class="builder-doc">`;

  // Heading block — title + solo props + pinned fields
  h += `<div class="bd" id="sc-heading">
    <div class="bd-hd">
      <span class="bd-lbl"><svg width="11" height="11"><use href="#ic-diamond"/></svg> Heading</span>
      <div class="bd-acts"><button class="sib"><svg width="12" height="12"><use href="#ic-more"/></svg></button></div>
    </div>
    <div class="bd-heading">
      <div class="bd-backlinks"><svg width="10" height="10"><use href="#ic-arrow-r"/></svg> No backlinks</div>
      <div class="bd-rec-title">${meta.recTitle}</div>
      <div class="bd-prop-rows">`;

  solos.forEach(s => {
    h += `<div class="bd-prop-row">
      <div class="bd-prop-icon-lbl"><svg width="12" height="12"><use href="#${s.icon}"/></svg>${s.label}</div>
      <div class="bd-prop-val">${rvHTML(s.rv)}</div>
      <button class="bd-row-act" onclick="toggleSecPanel('${s.id}')" title="Move to panel"><svg width="10" height="10"><use href="#ic-panel"/></svg></button>
    </div>`;
  });
  pinnedFields.forEach(({sec, f}) => {
    h += `<div class="bd-prop-row">
      <div class="bd-prop-icon-lbl"><svg width="12" height="12"><use href="#${f.icon}"/></svg>${f.label}</div>
      <div class="bd-prop-val">${rvHTML(f.rv)}</div>
      <button class="bd-row-act" onclick="toggleFieldPin('${sec.id}','${f.id}')" title="Unpin"><svg width="10" height="10"><use href="#ic-pin"/></svg></button>
    </div>`;
  });
  if (!solos.length && !pinnedFields.length) {
    h += `<div style="font-size:12px;color:#d0d0d0;padding:4px 2px 2px">Pin a field or add a solo property to show it here</div>`;
  }

  h += `</div></div></div>`; // close bd-prop-rows, bd-heading, bd

  // Content section blocks (non-solo, non-panel)
  mainSecs.forEach(sec => { if (sec.visible) h += renderBuilderBlock(sec); });

  // Add section
  h += `<div class="add-sec-card" onclick="addSection()"><svg width="12" height="12"><use href="#ic-plus"/></svg> Add section</div>`;
  h += `</div>`; // end builder-doc

  /* ── RIGHT: Panel column ── */
  h += `<div class="builder-panel-col">`;

  // Side panel label
  h += `<div style="font-size:10.5px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.6px;padding:2px 2px 6px;display:flex;align-items:center;gap:6px"><svg width="11" height="11"><use href="#ic-panel"/></svg> Side panel</div>`;

  if (!panelSecs.length) {
    h += `<div class="bp-card"><div class="bp-empty" style="padding:24px 16px">
      <div style="margin-bottom:6px">Nothing here yet</div>
      <div style="font-size:11px;color:#d0d0d0;line-height:1.6">Click <strong style="color:#bbb">→ Side panel</strong> on any section to move it here</div>
    </div></div>`;
  } else {
    panelSecs.forEach(sec => {
      const ICONS = { richtext:'ic-write', fields:'ic-tag', documents:'ic-docs', comments:'ic-mention', solo:'ic-status' };
      const icon = sec.icon || ICONS[sec.secType] || 'ic-tag';
      h += `<div class="bp-sec-card">
        <div class="bp-sec-card-hd">
          <span class="bp-sec-card-lbl"><svg width="10" height="10"><use href="#${icon}"/></svg> ${sec.label}</span>
          <button class="bp-back-btn" onclick="toggleSecPanel('${sec.id}')">← Back to page</button>
        </div>`;

      if (sec.secType === 'fields') {
        const vis = sec.fields.filter(f => f.visible);
        vis.forEach(f => {
          h += `<div class="bp-row">
            <div class="bp-lbl"><svg width="10" height="10"><use href="#${f.icon}"/></svg> ${f.label}</div>
            <div class="bp-val">${rvHTML(f.rv)}</div>
          </div>`;
        });
        if (!vis.length) h += `<div style="padding:10px 14px;font-size:12px;color:#ccc">No fields</div>`;
      } else if (sec.secType === 'documents') {
        h += `<div class="bp-row"><div class="bp-lbl"><svg width="10" height="10"><use href="#ic-docs"/></svg> Files</div><div class="bp-val" style="color:#bbb;font-size:12px">2 attached</div></div>`;
      } else if (sec.secType === 'comments') {
        h += `<div style="padding:10px 14px;font-size:12px;color:#bbb;display:flex;align-items:center;gap:6px"><svg width="11" height="11"><use href="#ic-mention"/></svg> Comments thread</div>`;
      } else if (sec.secType === 'solo') {
        h += `<div class="bp-row"><div class="bp-lbl"><svg width="10" height="10"><use href="#${sec.icon}"/></svg> ${sec.label}</div><div class="bp-val">${rvHTML(sec.rv)}</div></div>`;
      }

      h += `</div>`; // end bp-sec-card
    });
  }

  h += `</div>`; // end builder-panel-col
  h += `</div>`; // end builder-layout

  wrap.innerHTML = h;
}

function scDragAttrs(id) {
  return `draggable="true" ondragstart="scStart(event,'${id}')" ondragover="scOver(event,'${id}')" ondrop="scDrop(event,'${id}')" ondragleave="scLeave('${id}')"`;
}

function renderBuilderBlock(sec) {
  const ICONS = { richtext:'ic-write', fields:'ic-tag', documents:'ic-docs', comments:'ic-mention' };
  const icon = sec.icon || ICONS[sec.secType] || 'ic-tag';
  const inPanel = sec.inPanel ?? false;
  const canMove = sec.secType !== 'solo'; // all non-solo sections can move to panel (including locked ones like comments)

  let bodyHTML = '';

  if (sec.secType === 'richtext') {
    bodyHTML = `<div class="bd-body">
      <div class="bd-rt-preview">${sec.placeholder || 'Add content…'}</div>
    </div>`;
  } else if (sec.secType === 'fields') {
    const unpinned = sec.fields.filter(f => !(f.pinned ?? false));
    if (unpinned.length) {
      bodyHTML = `<div>`;
      unpinned.forEach(f => {
        bodyHTML += `<div class="fr ${f.visible?'':'off'}" id="fr-${f.id}"
          draggable="true"
          ondragstart="frStart(event,'${sec.id}','${f.id}')"
          ondragover="frOver(event,'${sec.id}','${f.id}')"
          ondrop="frDrop(event,'${sec.id}','${f.id}')"
          ondragleave="frLeave(event,'${f.id}')">
          <div class="fr-key"><div class="fr-key-ico"><svg width="12" height="12"><use href="#${f.icon}"/></svg></div><span class="fr-key-lbl">${f.label}</span></div>
          <div class="fr-val">${chipHTML(f.chip)}</div>
          <div class="fr-act">
            <button class="sib" onclick="toggleFieldPin('${sec.id}','${f.id}')" title="Pin to header"><svg width="11" height="11"><use href="#ic-pin"/></svg></button>
            <button class="sib"><svg width="12" height="12"><use href="#ic-more"/></svg></button>
            <button class="sib del" onclick="toggleFieldVis('${sec.id}','${f.id}')"><svg width="10" height="10"><use href="#ic-x"/></svg></button>
          </div>
        </div>`;
      });
      bodyHTML += `<div class="add-fr" onclick="addField('${sec.id}')"><svg width="11" height="11"><use href="#ic-plus"/></svg> Add field</div>`;
      bodyHTML += `</div>`;
    } else {
      bodyHTML = `<div class="add-fr" onclick="addField('${sec.id}')"><svg width="11" height="11"><use href="#ic-plus"/></svg> Add field</div>`;
    }
  } else if (sec.secType === 'documents') {
    bodyHTML = `<div class="bd-body"><div class="bd-locked"><svg width="12" height="12"><use href="#ic-docs"/></svg> 2 files attached</div></div>`;
  } else if (sec.secType === 'comments') {
    bodyHTML = `<div class="bd-body"><div class="bd-locked"><svg width="12" height="12"><use href="#ic-mention"/></svg> Comments &amp; activity</div></div>`;
  }

  return `<div class="bd" id="sc-${sec.id}" ${!sec.locked ? scDragAttrs(sec.id) : ''}>
    <div class="bd-hd${!sec.locked ? ' draggable' : ''}">
      <span class="bd-lbl">
        <svg width="11" height="11"><use href="#${icon}"/></svg>
        <input value="${sec.label}" onchange="renameSection('${sec.id}',this.value)" onclick="event.stopPropagation()" spellcheck="false" ${sec.locked ? 'readonly' : ''}>
      </span>
      <div class="bd-acts">
        ${canMove ? `<button class="bd-panel-btn" onclick="toggleSecPanel('${sec.id}')"><svg width="9" height="9"><use href="#ic-arrow-r"/></svg> Side panel</button>` : ''}
        <button class="sib"><svg width="12" height="12"><use href="#ic-more"/></svg></button>
        ${!sec.locked ? `<button class="sib del" onclick="toggleSecVis('${sec.id}')"><svg width="10" height="10"><use href="#ic-x"/></svg></button>` : ''}
      </div>
    </div>
    ${bodyHTML}
  </div>`;
}

function renderComments(s) {
  // Kept for any legacy calls — wraps renderBuilderBlock
  return renderBuilderBlock(s);
}

function chipHTML(chip) {
  if (!chip || !chip.label) return '';
  if (chip.cls) return `<span class="chip ${chip.cls}">${chip.icon?`<svg width="10" height="10"><use href="#${chip.icon}"/></svg>`:''} ${chip.label}</span>`;
  return `<span class="chip-plain">${chip.label}</span>`;
}

/* ── RENDER RECORD ── */
function renderRecord() {
  const el = document.getElementById('rp');
  const meta = RECORD_META[currentType];
  const panelSecs = layout.filter(s => (s.inPanel ?? false) && s.visible);
  let h = '';

  // Single shared header bar (spans card + panel width)
  h += `<div class="rp-hd">
    <div class="rp-type"><svg width="13" height="13" style="color:#bbb"><use href="#${meta.badgeIcon}"/></svg> ${meta.badge}</div>
    <button class="ra share">Share</button>
    <button class="ra ${rpPanelOpen?'panel-on':''}" id="rp-panel-btn" onclick="toggleRpSidePanel()" title="Side panel"><svg width="14" height="14"><use href="#ic-panel"/></svg></button>
    <button class="ra"><svg width="14" height="14"><use href="#ic-attach"/></svg></button>
    <button class="ra"><svg width="14" height="14"><use href="#ic-link"/></svg></button>
    <button class="ra" onclick="openFullscreen()" title="Full screen"><svg width="14" height="14"><use href="#ic-expand"/></svg></button>
    <button class="ra"><svg width="14" height="14"><use href="#ic-more"/></svg></button>
    <button class="ra" onclick="setMode('edit')" title="Edit layout"><svg width="14" height="14"><use href="#ic-edit"/></svg></button>
    <button class="ra"><svg width="14" height="14"><use href="#ic-arrow-r"/></svg></button>
  </div>
  <div class="rp-body">
  <div class="rp-main">`;  // open body + main col

  // Title
  h += `<div class="rp-title">${meta.recTitle}</div>`;

  // Solo props + pinned fields as labeled rows below title
  const solos = layout.filter(s => s.secType === 'solo' && s.visible && !(s.inPanel ?? false));
  const pinnedFields = [];
  layout.forEach(sec => {
    if (sec.secType === 'fields' && sec.visible && !(sec.inPanel ?? false))
      sec.fields.forEach(f => { if (f.visible && (f.pinned ?? false)) pinnedFields.push({sec, f}); });
  });
  if (solos.length || pinnedFields.length) {
    h += `<div class="rp-props">`;
    solos.forEach(s => {
      h += `<div class="rpp-row">
        <div class="rpp-lbl"><svg width="11" height="11"><use href="#${s.icon}"/></svg> ${s.label}</div>
        <div class="rpp-val">${rvHTML(s.rv)}</div>
      </div>`;
    });
    pinnedFields.forEach(({sec, f}) => {
      h += `<div class="rpp-row">
        <div class="rpp-lbl"><svg width="11" height="11"><use href="#${f.icon}"/></svg> ${f.label}</div>
        <div class="rpp-val">${rvHTML(f.rv)}</div>
      </div>`;
    });
    h += `</div>`;
  }

  // Body sections — skip solos and panel sections
  layout.forEach(sec => {
    if (!sec.visible || sec.secType === 'solo' || (sec.inPanel ?? false)) return;
    const sid = `rs-${sec.id}`;

    if (sec.secType === 'richtext') {
      if (!sec.rtFields?.length) return;
      h += `<div class="rs" id="${sid}">
        <div class="rs-hd" onclick="toggleRs('${sid}')">
          <svg width="12" height="12" class="rs-chev"><use href="#ic-chevron"/></svg>
          <span class="rs-label">${sec.label}</span>
        </div>
        <div class="rs-body rtf">`;
      sec.rtFields.forEach((f, i) => {
        if (i > 0) h += `<div class="rtf-sep"></div>`;
        h += `<div class="rtf-lbl">${f.label}</div><div class="rtf-txt">${f.html}</div>`;
        if (f.showImage) h += `<div class="rtf-img"><svg width="22" height="22"><use href="#ic-img"/></svg>&nbsp;&nbsp;${meta.recTitle}</div>`;
      });
      h += `</div></div>`;
    } else if (sec.secType === 'fields') {
      const vis = sec.fields.filter(f => f.visible && !(f.pinned ?? false));
      if (!vis.length) return;
      h += `<div class="rs" id="${sid}">
        <div class="rs-hd" onclick="toggleRs('${sid}')">
          <svg width="12" height="12" class="rs-chev"><use href="#ic-chevron"/></svg>
          <span class="rs-label">${sec.label}</span>
          <span class="rs-badge">${vis.length}</span>
        </div>
        <div class="rs-body" style="padding:2px 16px 10px">`;
      vis.forEach(f => {
        h += `<div class="rpp-row" style="padding:2px 0">
          <div class="rpp-lbl"><svg width="11" height="11"><use href="#${f.icon}"/></svg> ${f.label}</div>
          <div class="rpp-val">${rvHTML(f.rv)}</div>
        </div>`;
      });
      h += `</div></div>`;
    } else if (sec.secType === 'documents') {
      h += `<div class="rs" id="${sid}"><div class="rs-hd" onclick="toggleRs('${sid}')"><svg width="12" height="12" class="rs-chev"><use href="#ic-chevron"/></svg><span class="rs-label">${sec.label}</span><span class="rs-badge">2</span></div><div class="rs-body docs"><div class="doc-row"><div class="doc-ic pdf">PDF</div><span class="doc-name">Final plan</span><span class="doc-ext">PDF</span></div><div class="doc-row"><div class="doc-ic img">PNG</div><span class="doc-name">Design assets</span><span class="doc-ext">PNG</span></div></div></div>`;
    } else if (sec.secType === 'comments') {
      h += `<div class="rs" id="${sid}"><div class="rs-hd" onclick="toggleRs('${sid}')"><svg width="12" height="12" class="rs-chev"><use href="#ic-chevron"/></svg><span class="rs-label">${sec.label}</span></div><div class="rs-body cmts"><div class="cmt-tabs"><div class="ct on">Comments</div><div class="ct">All activity</div></div><div class="c-row"><div class="av-md" style="background:#e91e63">HM</div><div class="c-r"><div class="c-meta"><b>Hailey Moreson</b> created this record &middot; 2 days ago</div></div></div><div class="c-row"><div class="av-md" style="background:#2196f3">JH</div><div class="c-r"><div class="c-meta"><b>Josef Hoyos</b> &middot; 1 day ago</div><div class="c-body">It&rsquo;d be great to do a review soon with the larger group.</div></div><button class="c-like">&#9825;</button></div><div class="c-in-row"><div class="av-md" style="background:#e91e63">HM</div><input class="c-in" placeholder="Leave a comment&hellip;"><div style="display:flex;gap:2px"><button class="c-tb"><svg width="12" height="12"><use href="#ic-attach"/></svg></button><button class="c-tb"><svg width="12" height="12"><use href="#ic-emoji"/></svg></button><button class="c-tb"><svg width="12" height="12"><use href="#ic-mention"/></svg></button></div></div></div></div>`;
    }
  });

  // Build side panel content
  let ph = '';
  if (!panelSecs.length) {
    ph = `<div style="padding:28px 14px;text-align:center;font-size:12px;color:#ccc;line-height:1.8">Move sections here<br>using <strong style="color:#bbb">→ Side panel</strong><br>in the builder</div>`;
  } else {
    panelSecs.forEach(sec => {
      const ICONS = { richtext:'ic-write', fields:'ic-tag', documents:'ic-docs', comments:'ic-mention', solo:'ic-status' };
      const icon = sec.icon || ICONS[sec.secType] || 'ic-tag';
      ph += `<div class="rp-side-sec"><svg width="10" height="10"><use href="#${icon}"/></svg> ${sec.label}</div>`;
      if (sec.secType === 'fields') {
        sec.fields.filter(f => f.visible).forEach(f => {
          ph += `<div class="rp-side-row">
            <div class="rp-side-lbl"><svg width="11" height="11"><use href="#${f.icon}"/></svg> ${f.label}</div>
            <div class="rp-side-val">${rvHTML(f.rv)}</div>
          </div>`;
        });
      } else if (sec.secType === 'documents') {
        ph += `<div class="rp-side-row"><div class="rp-side-lbl"><svg width="11" height="11"><use href="#ic-docs"/></svg> Files</div><div class="rp-side-val" style="color:#aaa;font-size:12px">2 attached</div></div>`;
      } else if (sec.secType === 'comments') {
        ph += `<div class="rp-side-row"><div class="rp-side-lbl"><svg width="11" height="11"><use href="#ic-mention"/></svg> Thread</div><div class="rp-side-val" style="color:#aaa;font-size:12px">3 comments</div></div>`;
      } else if (sec.secType === 'solo') {
        ph += `<div class="rp-side-row"><div class="rp-side-lbl"><svg width="11" height="11"><use href="#${sec.icon}"/></svg> ${sec.label}</div><div class="rp-side-val">${rvHTML(sec.rv)}</div></div>`;
      }
    });
  }

  const panelTitle = panelSecs.length === 1 ? panelSecs[0].label : 'Details';

  h += `</div>`; // close rp-main

  // Side panel (full height — sibling to rp-main inside rp-body)
  h += `<div class="rp-side ${rpPanelOpen?'':'hidden'}" id="pv-panel-el">
    <div class="rp-side-hd">
      <span class="rp-side-title"><svg width="12" height="12" style="color:#bbb"><use href="#ic-tag"/></svg> ${panelTitle}</span>
      <button class="rp-side-add" title="Add field">+</button>
    </div>
    <div class="rp-side-body">${ph}</div>
  </div>`;

  h += `</div>`; // close rp-body

  el.innerHTML = h;
}

let rpPanelOpen = false;
function toggleRpSidePanel() {
  rpPanelOpen = !rpPanelOpen;
  document.getElementById('pv-panel-el')?.classList.toggle('hidden', !rpPanelOpen);
  document.getElementById('rp-panel-btn')?.classList.toggle('panel-on', rpPanelOpen);
}

function rvHTML(rv) {
  if (!rv) return '<span style="color:#ddd">&mdash;</span>';
  if (rv.type === 'text')      return `<span>${rv.val}</span>`;
  if (rv.type === 'tag')       return `<span class="rt ${rv.cls}">${rv.val}</span>`;
  if (rv.type === 'person')    return `<span class="av-xs" style="background:${rv.color}">${rv.initials}</span><span>${rv.name}</span>`;
  if (rv.type === 'connected') return `<span style="display:inline-flex;align-items:center;gap:4px"><svg width="11" height="11"><use href="#ic-connected"/></svg>${rv.val}</span>`;
  if (rv.type === 'multi')     return rv.vals.map(v => `<span class="rt ${v.cls}">${v.val}</span>`).join('');
  return '&mdash;';
}

function toggleRs(id) { document.getElementById(id)?.classList.toggle('closed'); }
function toggleRpPanel() {
  document.getElementById('rp-pb')?.classList.toggle('hidden');
  document.getElementById('rp-pt')?.classList.toggle('open');
}

/* ── INTERACTIONS ── */
function toggleFieldVis(secId, fId) {
  const f = layout.find(s => s.id === secId).fields.find(f => f.id === fId);
  f.visible = !f.visible;
  document.getElementById(`fr-${fId}`)?.classList.toggle('off', !f.visible);
}
function toggleFieldPin(secId, fId) {
  const f = layout.find(s => s.id === secId).fields.find(f => f.id === fId);
  f.pinned = !(f.pinned ?? false);
  renderBuilder();
}
function toggleSecPanel(secId) {
  const sec = layout.find(s => s.id === secId);
  sec.inPanel = !(sec.inPanel ?? false);
  renderBuilder();
}
function toggleSecVis(secId) { layout.find(s => s.id === secId).visible = false; renderBuilder(); }
function renameSection(secId, val) { layout.find(s => s.id === secId).label = val; }

function addSection() {
  const id = 'sec-new-' + Date.now();
  const idx = layout.findIndex(s => s.locked);
  layout.splice(idx >= 0 ? idx : layout.length, 0, {id, secType:'fields', label:'New Section', visible:true, locked:false, fields:[]});
  renderBuilder();
  setTimeout(() => { const i = document.querySelector(`#sc-${id} .sc-name`); if (i) { i.focus(); i.select(); } }, 30);
}
function addField(secId) {
  const sec = layout.find(s => s.id === secId);
  const id = 'f-new-' + Date.now();
  sec.fields.push({id, icon:'ic-tag', label:'New Field', visible:true, chip:{cls:'',label:'Text'}, rv:{type:'text',val:'\u2014'}});
  renderBuilder();
}

/* ── DRAG: SECTIONS ── */
let dragSc = null;
function scStart(e, id) { dragSc = id; e.dataTransfer.effectAllowed = 'move'; }
function scOver(e, id) { if (!dragSc || dragSc === id) return; e.preventDefault(); document.querySelectorAll('.bd').forEach(el => el.classList.remove('drag-over')); document.getElementById(`sc-${id}`)?.classList.add('drag-over'); }
function scLeave(id) { document.getElementById(`sc-${id}`)?.classList.remove('drag-over'); }
function scDrop(e, tId) { e.preventDefault(); if (!dragSc || dragSc === tId) { cleanDrag(); return; } const si = layout.findIndex(s => s.id === dragSc), ti = layout.findIndex(s => s.id === tId); const [sec] = layout.splice(si, 1); layout.splice(ti, 0, sec); cleanDrag(); renderBuilder(); }

/* ── DRAG: FIELDS ── */
let dragFr = null;
function frStart(e, sId, fId) { dragFr = {sId, fId}; e.dataTransfer.effectAllowed = 'move'; e.stopPropagation(); requestAnimationFrame(() => document.getElementById(`fr-${fId}`)?.classList.add('dragging')); }
function frOver(e, sId, fId) { if (!dragFr || dragFr.fId === fId) return; e.preventDefault(); e.stopPropagation(); document.querySelectorAll('.fr').forEach(el => el.classList.remove('drop-above')); document.getElementById(`fr-${fId}`)?.classList.add('drop-above'); }
function frLeave(e, fId) { document.getElementById(`fr-${fId}`)?.classList.remove('drop-above'); }
function frDrop(e, tSId, tFId) { e.preventDefault(); e.stopPropagation(); if (!dragFr || dragFr.fId === tFId) { cleanDrag(); return; } const src = layout.find(s => s.id === dragFr.sId), tgt = layout.find(s => s.id === tSId); const si = src.fields.findIndex(f => f.id === dragFr.fId); const [fld] = src.fields.splice(si, 1); const ti = tgt.fields.findIndex(f => f.id === tFId); tgt.fields.splice(ti, 0, fld); cleanDrag(); renderBuilder(); }

function cleanDrag() { document.querySelectorAll('.bd').forEach(el => el.classList.remove('drag-over')); document.querySelectorAll('.fr').forEach(el => el.classList.remove('dragging', 'drop-above')); dragSc = null; dragFr = null; }
document.addEventListener('dragend', cleanDrag);

/* ── FULL-SCREEN DOC ── */
let fvNarrow = false;

function openFullscreen() {
  document.getElementById('fv').classList.remove('hidden');
  // Show panel open on Properties view
  document.getElementById('fv-cmts').classList.remove('hidden');
  document.getElementById('fv-cmt-toggle').classList.add('on');
  showFvView('props');
  renderFullscreenDoc();
}
function closeFullscreen() {
  document.getElementById('fv').classList.add('hidden');
}
function toggleFvComments() {
  const panel = document.getElementById('fv-cmts');
  const isHidden = panel.classList.contains('hidden');
  if (isHidden) {
    panel.classList.remove('hidden');
    document.getElementById('fv-cmt-toggle').classList.add('on');
    showFvView('comments');
  } else {
    // If showing props, switch to comments; if showing comments, close panel
    const cmtsHidden = document.getElementById('fv-cmts-body').classList.contains('hidden');
    if (cmtsHidden) {
      showFvView('comments');
    } else {
      closeFvPanel();
    }
  }
}
function toggleFvNarrow() {
  fvNarrow = !fvNarrow;
  document.getElementById('fv-doc').classList.toggle('narrow', fvNarrow);
  document.getElementById('fv-narrow-toggle').classList.toggle('on', fvNarrow);
}

function renderFullscreenDoc() {
  const meta = RECORD_META[currentType];
  let h = '';

  // Breadcrumb
  h += `<div class="fv-breadcrumb">
    <span class="fv-bc-item">${meta.dbTitle}</span>
    <svg width="8" height="8" class="fv-bc-sep"><use href="#ic-chevron" style="transform:rotate(-90deg)"/></svg>
    <span class="fv-bc-item">${meta.badge}</span>
    <svg width="8" height="8" class="fv-bc-sep"><use href="#ic-chevron" style="transform:rotate(-90deg)"/></svg>
    <span style="color:#555">${meta.recTitle}</span>
  </div>`;

  // Title
  h += `<div class="fv-title">${meta.recTitle}</div>`;

  // Solo properties as labeled rows below title
  const solos = layout.filter(s => s.secType === 'solo' && s.visible);
  if (solos.length) {
    h += `<div class="fv-prop-rows">`;
    solos.forEach(s => {
      h += `<div class="fv-prop-row">
        <div class="fv-prop-row-lbl"><svg width="12" height="12"><use href="#${s.icon}"/></svg> ${s.label}</div>
        <div class="fv-prop-row-val">${rvHTML(s.rv)}</div>
      </div>`;
    });
    h += `</div>`;
  }

  // Main content — richtext and comments only (fields always live in the right panel)
  layout.forEach(sec => {
    if (!sec.visible || sec.secType === 'solo' || sec.secType === 'fields') return;

    if (sec.secType === 'richtext' && sec.rtFields?.length) {
      sec.rtFields.forEach((f, i) => {
        if (i > 0) h += `<div class="fv-sect-divider"></div>`;
        h += `<div class="fv-sect">
          <div class="fv-sect-h">${f.label}</div>
          <div class="fv-sect-body">${f.html}</div>
          ${f.showImage ? `<div class="fv-img"><svg width="28" height="28"><use href="#ic-img"/></svg>&nbsp;&nbsp;${meta.recTitle}</div>` : ''}
        </div>`;
      });
    } else if (sec.secType === 'documents') {
      h += `<div class="fv-sect">
        <div class="fv-sect-h" style="display:flex;align-items:center;gap:6px"><svg width="14" height="14" style="color:#bbb"><use href="#ic-docs"/></svg> ${sec.label}</div>
        <div style="display:flex;gap:10px;margin-top:8px">
          <div class="doc-row"><div class="doc-ic pdf">PDF</div><span class="doc-name">Final plan</span><span class="doc-ext">PDF</span></div>
          <div class="doc-row"><div class="doc-ic img">PNG</div><span class="doc-name">Design assets</span><span class="doc-ext">PNG</span></div>
        </div>
      </div>`;
    } else if (sec.secType === 'comments') {
      h += `<div class="fv-sect-divider"></div>
        <div style="font-size:11px;font-weight:600;color:#bbb;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:12px">Comments &amp; Activity</div>`;
      const comments = [
        { av:'HM', color:'#e91e63', name:'Hailey Moreson', date:'2 days ago',  body:'Created this record.' },
        { av:'JH', color:'#2196f3', name:'Josef Hoyos',    date:'1 day ago',   body:'It\'d be great to do a review soon with the larger group.' },
        { av:'KN', color:'#ff9800', name:'Kai Nani',       date:'4 days ago',  body:'Be sure to check out the final presentation to reference Ian Bryson so we\'re good.' }
      ];
      comments.forEach(c => {
        h += `<div class="fv-c-row" style="margin-bottom:14px">
          <div class="fv-av" style="background:${c.color};width:26px;height:26px;font-size:9px">${c.av}</div>
          <div class="fv-c-r">
            <div class="fv-c-top"><span class="fv-c-name">${c.name}</span><span class="fv-c-date">${c.date}</span></div>
            <div class="fv-c-body">${c.body}</div>
          </div>
        </div>`;
      });
      h += `<div style="display:flex;gap:8px;align-items:center;margin-top:8px">
        <div class="fv-av" style="background:#7c3aed;width:26px;height:26px;font-size:9px;flex-shrink:0">LR</div>
        <input class="fv-c-input" placeholder="Leave a comment…" style="flex:1">
      </div>`;
    }
  });

  document.getElementById('fv-doc').innerHTML = h;
  renderFvProperties();
}

function renderFvComments() {
  const meta = RECORD_META[currentType];
  // Reuse the same comment data across all types for the prototype
  const comments = [
    { av:'SK', color:'#e91e63', name:'Sarah Kim',   date:'Yesterday',  body:'Please verify the 2026 contribution limit before republishing.' },
    { av:'HA', color:'#2196f3', name:'HR Admin',    date:'Mar 14',     body:'Should clarify part-time employee vesting schedule.' },
    { av:'MR', color:'#ff9800', name:'Mike Reyes',  date:'Mar 12',     body:'Is the Roth 401(k) option covered in another article?' }
  ];
  let h = '';
  comments.forEach(c => {
    h += `<div class="fvp-c-row">
      <div class="fvp-av" style="background:${c.color}">${c.av}</div>
      <div class="fvp-c-r">
        <div class="fvp-c-top"><span class="fvp-c-name">${c.name}</span><span class="fvp-c-date">${c.date}</span></div>
        <div class="fvp-c-body">${c.body}</div>
      </div>
    </div>`;
  });
  document.getElementById('fv-cmts-body').innerHTML = h;
}

function renderFvProperties() {
  const meta = RECORD_META[currentType];
  const fieldSecs = layout.filter(s => s.secType === 'fields' && s.visible);
  const rtSecs = layout.filter(s => s.secType === 'richtext' && s.visible && s.inPanel && s.rtFields?.length);
  let h = '';

  if (!fieldSecs.length && !rtSecs.length) {
    h = `<div style="padding:32px 14px;text-align:center;font-size:13px;color:#ccc">No fields defined.</div>`;
  } else {
    // Field sections — flat rows, grouped by section with a small label if >1 section
    const multiSec = fieldSecs.filter(s => s.fields.some(f => f.visible)).length > 1;
    fieldSecs.forEach((sec, si) => {
      const vis = sec.fields.filter(f => f.visible);
      if (!vis.length) return;
      if (multiSec) {
        h += `<div class="fvp-sec-lbl"><svg width="10" height="10"><use href="#ic-tag"/></svg> ${sec.label}</div>`;
      } else if (si === 0) {
        h += `<div style="height:6px"></div>`;
      }
      vis.forEach(f => {
        h += `<div class="fvp-row">
          <div class="fvp-lbl"><svg width="12" height="12"><use href="#${f.icon}"/></svg> ${f.label}</div>
          <div class="fvp-val">${rvHTML(f.rv)}</div>
        </div>`;
      });
    });

    // Richtext sections that have been moved to the panel
    rtSecs.forEach(sec => {
      h += `<div class="fvp-rt-divider"></div>`;
      sec.rtFields.forEach((f, i) => {
        if (i === 0) {
          h += `<div class="fvp-rt-hd">${f.label}</div>`;
        } else {
          h += `<div class="fvp-rt-sub">${f.label}</div>`;
        }
        // Extract sub-sections from the HTML (bold headings become sub-labels)
        h += `<div class="fvp-rt-body">${f.html}</div>`;
        if (f.showImage) {
          h += `<div class="fvp-rt-img"><svg width="24" height="24"><use href="#ic-img"/></svg></div>`;
        }
      });
    });
  }

  document.getElementById('fv-props-body').innerHTML = h;

  // Update panel title based on first field section name
  const firstSec = fieldSecs.find(s => s.fields.some(f => f.visible));
  document.getElementById('fvp-title').textContent = firstSec ? firstSec.label : 'Fields';
}

function showFvView(view) {
  const isProps = view === 'props';
  // Update strip icon states
  document.getElementById('fvp-btn-fields')?.classList.toggle('on', isProps);
  document.getElementById('fvp-btn-comments')?.classList.toggle('on', !isProps);
  // Toggle body panels
  document.getElementById('fv-props-body').classList.toggle('hidden', !isProps);
  document.getElementById('fv-cmts-body').classList.toggle('hidden', isProps);
  document.getElementById('fv-c-in-row-wrap').classList.toggle('hidden', isProps);
  // Update header title
  const titleEl = document.getElementById('fvp-title');
  if (titleEl) titleEl.textContent = isProps ? (layout.find(s => s.secType === 'fields' && s.visible)?.label || 'Fields') : 'Comments';
  if (isProps) renderFvProperties();
  else renderFvComments();
}
function closeFvPanel() {
  document.getElementById('fv-cmts').classList.add('hidden');
  document.getElementById('fv-cmt-toggle').classList.remove('on');
}

renderBuilder();
</script>
